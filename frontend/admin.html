<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员端 - 宿舍报修系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .container { margin-top: 20px; }
        .status-badge { padding: 3px 8px; border-radius: 20px; font-size: 0.8rem; font-weight: normal; }
        .status-pending { background-color: #ffc107; color: #000; }
        .status-processing { background-color: #17a2b8; color: #fff; }
        .status-completed { background-color: #28a745; color: #fff; }
        .table th { background-color: #343a40; color: white; }
    </style>
</head>
<body>
<div class="container">
    <nav class="navbar navbar-light bg-light shadow-sm rounded mb-4">
        <div class="container-fluid">
            <span class="navbar-brand h1 mb-0">📋 管理员面板</span>
            <button class="btn btn-outline-danger" onclick="logout()">退出登录</button>
        </div>
    </nav>
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <span>🔧 所有工单</span>
            <button class="btn btn-sm btn-light" onclick="loadAllOrders()">🔄 刷新</button>
        </div>
        <div class="card-body">
            <div id="ordersContainer">加载中...</div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const token = localStorage.getItem('token');
    if (!token) location.href = '/';

    let repairmenList = [];

    function logout() {
        localStorage.clear();
        location.href = '/';
    }

    // 获取维修工列表
    async function loadRepairmen() {
        try {
            const res = await fetch('/api/users/repairmen', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if (data.code === 200 && data.data) {
                repairmenList = data.data;
            } else {
                console.error('获取维修工列表失败');
            }
        } catch (err) {
            console.error(err);
        }
    }

    async function loadAllOrders() {
        const container = document.getElementById('ordersContainer');
        container.innerHTML = '<div class="text-center text-muted">加载中...</div>';
        try {
            const res = await fetch('/api/repairs/all', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if (data.code !== 200 || !data.data) {
                container.innerHTML = '<div class="alert alert-danger">加载失败</div>';
                return;
            }
            const orders = data.data;
            if (orders.length === 0) {
                container.innerHTML = '<div class="text-center text-muted">暂无工单</div>';
                return;
            }

            if (repairmenList.length === 0) {
                await loadRepairmen();
            }

            const table = document.createElement('table');
            table.className = 'table table-striped table-bordered table-hover';
            const thead = document.createElement('thead');
            thead.className = 'table-dark';
            const headerRow = document.createElement('tr');
            ['工单ID', '学生ID', '房间号', '故障描述', '状态', '维修工', '分配操作'].forEach(text => {
                const th = document.createElement('th');
                th.textContent = text;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            for (let o of orders) {
                const row = tbody.insertRow();
                row.insertCell().textContent = o.id;
                row.insertCell().textContent = o.student_id;
                row.insertCell().textContent = o.room;
                row.insertCell().textContent = o.description;

                // 状态徽章
                const statusCell = row.insertCell();
                let statusText = '', badgeClass = '';
                if (o.status === 'pending') { statusText = '待分配'; badgeClass = 'bg-warning text-dark'; }
                else if (o.status === 'processing') { statusText = '处理中'; badgeClass = 'bg-info text-white'; }
                else if (o.status === 'completed') { statusText = '已完成'; badgeClass = 'bg-success text-white'; }
                else statusText = o.status;
                const badge = document.createElement('span');
                badge.className = `badge ${badgeClass}`;
                badge.textContent = statusText;
                statusCell.appendChild(badge);

                // 维修工显示
                row.insertCell().textContent = o.repairman_id ? `ID: ${o.repairman_id}` : '未分配';

                // 分配操作列
                const actionCell = row.insertCell();
                if (o.status !== 'completed') {
                    const select = document.createElement('select');
                    select.className = 'form-select form-select-sm d-inline-block';
                    select.style.width = '160px';
                    select.id = `repairman-select-${o.id}`;
                    const defaultOption = document.createElement('option');
                    defaultOption.value = '';
                    defaultOption.textContent = '-- 选择维修工 --';
                    select.appendChild(defaultOption);
                    for (let r of repairmenList) {
                        const option = document.createElement('option');
                        option.value = r.id;
                        option.textContent = `${r.username} (ID: ${r.id})`;
                        if (o.repairman_id === r.id) option.selected = true;
                        select.appendChild(option);
                    }
                    const btn = document.createElement('button');
                    btn.textContent = '分配';
                    btn.className = 'btn btn-sm btn-primary ms-2';
                    btn.onclick = () => assignOrder(o.id, select.value);
                    actionCell.appendChild(select);
                    actionCell.appendChild(btn);
                } else {
                    actionCell.textContent = '已完成，不可分配';
                }
                tbody.appendChild(row);
            }
            table.appendChild(tbody);
            container.innerHTML = '';
            container.appendChild(table);
        } catch (err) {
            console.error(err);
            container.innerHTML = '<div class="alert alert-danger">网络错误</div>';
        }
    }

    async function assignOrder(orderId, repairmanId) {
        if (!repairmanId) {
            alert('请选择维修工');
            return;
        }
        try {
            const res = await fetch(`/api/repairs/${orderId}/assign`, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ repairman_id: parseInt(repairmanId) })
            });
            const data = await res.json();
            if (res.ok) {
                alert('分配成功');
                loadAllOrders();
            } else {
                alert(data.error || '分配失败');
            }
        } catch (err) {
            alert('请求失败');
        }
    }

    loadRepairmen().then(() => loadAllOrders());
</script>
</body>
</html>
