<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>维修工端 - 宿舍报修系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #f4f6f9; font-family: 'Segoe UI', system-ui, sans-serif; }
        .sidebar { background: #2c3e66; min-height: 100vh; color: white; }
        .sidebar .nav-link { color: #e0e0e0; padding: 0.8rem 1.5rem; border-radius: 0.5rem; margin: 0.2rem 0; transition: 0.2s; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #1e2a4a; color: white; }
        .sidebar .nav-link i { width: 24px; margin-right: 10px; }
        .card { border: none; border-radius: 1rem; box-shadow: 0 0 15px rgba(0,0,0,0.05); }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 500; }
        .status-pending { background-color: #ffc107; color: #000; }
        .status-processing { background-color: #17a2b8; color: #fff; }
        .status-completed { background-color: #28a745; color: #fff; }
        .stats-card { background: white; border-radius: 0.8rem; padding: 1rem; text-align: center; transition: transform 0.2s; cursor: pointer; }
        .stats-card:hover { transform: translateY(-5px); background: #e9ecef; }
        .filter-bar { gap: 8px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 1rem; }
        .filter-item { min-width: 130px; }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 1050; }
        .skeleton { background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%); background-size: 200% 100%; animation: loading 1.5s infinite; border-radius: 4px; height: 40px; margin: 10px 0; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .user-info { background: #fff; padding: 4px 12px; border-radius: 30px; font-size: 0.9rem; }
        .table-row-clickable { cursor: pointer; transition: background 0.1s; }
        .table-row-clickable:hover { background: #f1f3f5 !important; }
        .quick-stats { background: rgba(255,255,255,0.1); border-radius: 0.5rem; padding: 0.5rem; margin-top: 1rem; }
        .quick-stats .stat-item { text-align: center; padding: 0.3rem; }
    </style>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>
<div class="container-fluid p-0">
    <div class="row g-0">
        <div class="col-md-3 col-lg-2 sidebar p-3">
            <div class="text-center mb-4"><i class="fas fa-wrench fa-2x"></i><h5 class="mt-2">维修工面板</h5><span class="badge bg-light text-dark mt-1">维修工端</span></div>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link active" id="nav-all" href="#" onclick="switchNav('all')"><i class="fas fa-clipboard-list"></i> 我的工单</a></li>
                <li class="nav-item"><a class="nav-link" id="nav-pending" href="#" onclick="switchNav('pending')"><i class="fas fa-clock"></i> 待处理工单</a></li>
                <li class="nav-item"><a class="nav-link" id="nav-processing" href="#" onclick="switchNav('processing')"><i class="fas fa-tools"></i> 处理中工单</a></li>
                <li class="nav-item"><a class="nav-link" id="nav-completed" href="#" onclick="switchNav('completed')"><i class="fas fa-check-circle"></i> 已完成工单</a></li>
            </ul>
            <div class="quick-stats">
                <h6 class="text-center"><i class="fas fa-chart-simple me-1"></i>快速统计</h6>
                <div class="row text-center">
                    <div class="col-4 stat-item"><span class="badge bg-warning text-dark">待处理</span><div id="sidebarPending" class="fw-bold">0</div></div>
                    <div class="col-4 stat-item"><span class="badge bg-info">处理中</span><div id="sidebarProcessing" class="fw-bold">0</div></div>
                    <div class="col-4 stat-item"><span class="badge bg-success">已完成</span><div id="sidebarCompleted" class="fw-bold">0</div></div>
                </div>
            </div>
            <hr class="bg-light"><button class="btn btn-outline-light w-100" onclick="logout()"><i class="fas fa-sign-out-alt"></i> 退出登录</button>
        </div>
        <div class="col-md-9 col-lg-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3><i class="fas fa-tools me-2"></i>维修工工作台</h3>
                <div class="user-info"><i class="fas fa-user-circle me-1"></i><span id="userName">维修工</span></div>
            </div>
            <!-- 统计卡片 -->
            <div class="row g-3 mb-4">
                <div class="col-md-4"><div class="stats-card" onclick="quickFilter('pending')"><h5>待处理</h5><h2 class="text-warning" id="pendingCount">0</h2></div></div>
                <div class="col-md-4"><div class="stats-card" onclick="quickFilter('processing')"><h5>处理中</h5><h2 class="text-info" id="processingCount">0</h2></div></div>
                <div class="col-md-4"><div class="stats-card" onclick="quickFilter('completed')"><h5>已完成</h5><h2 class="text-success" id="completedCount">0</h2></div></div>
            </div>
            <!-- 工单卡片 -->
            <div class="card">
                <div class="card-header bg-white">
                    <div class="d-flex justify-content-between align-items-center flex-wrap">
                        <span><i class="fas fa-filter me-2"></i>筛选条件</span>
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-primary" onclick="applyFilter()">查询</button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="resetFilter()">重置</button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="loadOrders()"><i class="fas fa-sync-alt"></i> 刷新</button>
                        </div>
                    </div>
                    <hr class="my-2">
                    <div class="row g-2 filter-bar">
                        <div class="col-auto filter-item"><label>工单ID</label><input type="text" id="filterId" class="form-control form-control-sm" placeholder="工单ID"></div>
                        <div class="col-auto filter-item"><label>房间号</label><input type="text" id="filterRoom" class="form-control form-control-sm" placeholder="房间号"></div>
                        <div class="col-auto filter-item"><label>状态</label><select id="filterStatus" class="form-select form-select-sm"><option value="">全部</option><option value="pending">待分配</option><option value="processing">处理中</option><option value="completed">已完成</option></select></div>
                        <div class="col-auto filter-item"><label>评价</label><select id="filterEval" class="form-select form-select-sm"><option value="">全部</option><option value="good">好评(≥4分)</option><option value="bad">差评(≤2分)</option><option value="none">未评价</option></select></div>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div id="ordersContainer" class="p-3">加载中...</div>
                </div>
                <div class="card-footer bg-white" id="paginationFooter"></div>
            </div>
        </div>
    </div>
</div>
<!-- 详情模态框 -->
<div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title"><i class="fas fa-clipboard-list me-2"></i>工单详情</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4" id="modalContent">加载中...</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="fas fa-times me-1"></i>关闭</button>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const token = localStorage.getItem('token');
    if (!token) location.href = '/';
    let allOrders = [], filteredOrders = [], currentPage = 1, pageSize = 5;

    function showToast(msg, type='success') {
        const cont = document.getElementById('toastContainer');
        const html = `<div class="toast align-items-center text-white bg-${type} border-0" role="alert"><div class="d-flex"><div class="toast-body">${msg}</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div>`;
        cont.insertAdjacentHTML('beforeend', html);
        const el = cont.lastElementChild;
        new bootstrap.Toast(el, { autohide: true, delay: 2000 }).show();
        el.addEventListener('hidden.bs.toast', () => el.remove());
    }
    function logout() { localStorage.clear(); location.href = '/'; }
    function quickFilter(status) { document.getElementById('filterStatus').value = status; applyFilter(); }
    function switchNav(type) {
        ['nav-all','nav-pending','nav-processing','nav-completed'].forEach(id => document.getElementById(id).classList.remove('active'));
        if (type === 'all') document.getElementById('nav-all').classList.add('active');
        else if (type === 'pending') document.getElementById('nav-pending').classList.add('active');
        else if (type === 'processing') document.getElementById('nav-processing').classList.add('active');
        else if (type === 'completed') document.getElementById('nav-completed').classList.add('active');
        const statusSel = document.getElementById('filterStatus');
        statusSel.value = type === 'all' ? '' : type;
        applyFilter();
    }
    async function loadOrders() {
        const cont = document.getElementById('ordersContainer');
        cont.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
        try {
            const res = await fetch('/api/repairs/assigned', { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            if (data.code !== 200) throw new Error();
            allOrders = data.data;
            document.getElementById('userName').innerText = allOrders.length ? '维修工' : '维修工';
            updateStats();
            resetFilter();
        } catch(e) { cont.innerHTML = '<div class="alert alert-danger">加载失败</div>'; }
    }
    function updateStats() {
        const pending = allOrders.filter(o=>o.status==='pending').length;
        const processing = allOrders.filter(o=>o.status==='processing').length;
        const completed = allOrders.filter(o=>o.status==='completed').length;
        document.getElementById('pendingCount').innerText = pending;
        document.getElementById('processingCount').innerText = processing;
        document.getElementById('completedCount').innerText = completed;
        document.getElementById('sidebarPending').innerText = pending;
        document.getElementById('sidebarProcessing').innerText = processing;
        document.getElementById('sidebarCompleted').innerText = completed;
    }
    function applyFilter() {
        const id = document.getElementById('filterId').value.trim();
        const room = document.getElementById('filterRoom').value.trim().toLowerCase();
        const status = document.getElementById('filterStatus').value;
        const evalFilter = document.getElementById('filterEval').value;
        filteredOrders = allOrders.filter(o => (!id || String(o.id).includes(id)) && (!room || o.room.toLowerCase().includes(room)) && (!status || o.status === status));
        if (evalFilter === 'good') filteredOrders = filteredOrders.filter(o => o.evaluation && o.evaluation.score >= 4);
        else if (evalFilter === 'bad') filteredOrders = filteredOrders.filter(o => o.evaluation && o.evaluation.score <= 2);
        else if (evalFilter === 'none') filteredOrders = filteredOrders.filter(o => !o.evaluation);
        currentPage = 1;
        renderOrders();
    }
    function resetFilter() {
        document.getElementById('filterId').value = '';
        document.getElementById('filterRoom').value = '';
        document.getElementById('filterStatus').value = '';
        document.getElementById('filterEval').value = '';
        filteredOrders = [...allOrders];
        currentPage = 1;
        renderOrders();
        switchNav('all');
    }
    function renderOrders() {
        const start = (currentPage-1)*pageSize, pageData = filteredOrders.slice(start, start+pageSize);
        const cont = document.getElementById('ordersContainer');
        if (!pageData.length) { cont.innerHTML = '<div class="text-center text-muted py-5"><i class="fas fa-inbox fa-3x mb-3 d-block"></i>暂无工单</div>'; document.getElementById('paginationFooter').innerHTML = ''; return; }
        let html = '<table class="table table-hover align-middle"><thead class="table-light"><tr><th>ID</th><th>房间号</th><th>故障描述</th><th>状态</th><th>评价</th><th>操作</th></tr></thead><tbody>';
        for (let o of pageData) {
            let statusClass = o.status==='pending'?'status-pending':o.status==='processing'?'status-processing':'status-completed';
            let statusText = o.status==='pending'?'待分配':o.status==='processing'?'处理中':'已完成';
            let evalHtml = o.evaluation ? `评分: ${o.evaluation.score}<br><small>${escapeHtml(o.evaluation.comment||'')}</small>` : '暂无评价';
            let actionHtml = '';
            if (o.status === 'processing') {
                actionHtml = `<select id="status-${o.id}" class="form-select form-select-sm d-inline-block w-auto"><option value="processing">处理中</option><option value="completed">已完成</option></select>
                              <button class="btn btn-sm btn-primary ms-2" onclick="event.stopPropagation(); updateStatus(${o.id})">更新</button>`;
            } else if (o.status === 'pending') { actionHtml = '<span class="text-muted">待分配</span>'; }
            else { actionHtml = '<span class="text-success">已完成</span>'; }
            html += `<tr class="table-row-clickable" onclick="showDetail(${o.id})">
                        <td>${escapeHtml(o.id)}</td><td>${escapeHtml(o.room)}</td><td>${escapeHtml(o.description)}</td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        <td>${evalHtml}</td>
                        <td onclick="event.stopPropagation()">${actionHtml}</td>
                    </tr>`;
        }
        html += '</tbody></table>';
        cont.innerHTML = html;
        const totalPages = Math.ceil(filteredOrders.length/pageSize);
        let pg = '<nav><ul class="pagination pagination-sm justify-content-center">';
        for (let i=1;i<=totalPages;i++) pg += `<li class="page-item ${i===currentPage?'active':''}"><button class="page-link" onclick="goToPage(${i})">${i}</button></li>`;
        pg += '</ul></nav>';
        document.getElementById('paginationFooter').innerHTML = totalPages>1 ? pg : '';
    }
    function goToPage(p){ currentPage = p; renderOrders(); }
    function escapeHtml(s){ if(!s) return ''; return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
    async function updateStatus(orderId) {
        const newStatus = document.getElementById(`status-${orderId}`).value;
        if (!confirm(`确认将工单 #${orderId} 状态更新为“${newStatus === 'processing' ? '处理中' : '已完成'}”吗？`)) return;
        try {
            const res = await fetch(`/api/repairs/${orderId}/status`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
            const data = await res.json();
            if (res.ok) { showToast('状态更新成功', 'success'); loadOrders(); }
            else showToast(data.error || '更新失败', 'danger');
        } catch(e) { showToast('请求失败', 'danger'); }
    }
    async function showDetail(orderId) {
        const order = allOrders.find(o => o.id == orderId);
        if (!order) return;
        let statusText = '', statusBadge = '';
        if (order.status === 'pending') { statusText = '待分配'; statusBadge = 'bg-warning text-dark'; }
        else if (order.status === 'processing') { statusText = '处理中'; statusBadge = 'bg-info text-white'; }
        else { statusText = '已完成'; statusBadge = 'bg-success text-white'; }
        const modalBody = document.getElementById('modalContent');
        modalBody.innerHTML = `
            <div class="row mb-3"><div class="col-4 fw-bold"><i class="fas fa-hashtag text-secondary"></i> 工单ID：</div><div class="col-8">${escapeHtml(order.id)}</div></div>
            <div class="row mb-3"><div class="col-4 fw-bold"><i class="fas fa-door-open text-secondary"></i> 房间号：</div><div class="col-8">${escapeHtml(order.room)}</div></div>
            <div class="row mb-3"><div class="col-4 fw-bold"><i class="fas fa-align-left text-secondary"></i> 故障描述：</div><div class="col-8">${escapeHtml(order.description)}</div></div>
            <div class="row mb-3"><div class="col-4 fw-bold"><i class="fas fa-chart-line text-secondary"></i> 状态：</div><div class="col-8"><span class="badge ${statusBadge} px-3 py-2">${statusText}</span></div></div>
            <div class="row mb-3"><div class="col-4 fw-bold"><i class="fas fa-star text-secondary"></i> 评价：</div><div class="col-8">${order.evaluation ? `评分: ${order.evaluation.score}<br>评论：${escapeHtml(order.evaluation.comment||'')}` : '<span class="text-muted">暂无评价</span>'}</div></div>
        `;
        new bootstrap.Modal(document.getElementById('detailModal')).show();
    }
    loadOrders();
</script>
</body>
</html>
