<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宿舍报修系统 - 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .login-card { max-width: 450px; margin: 80px auto; }
        .register-link { cursor: pointer; color: #0d6efd; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card login-card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4>宿舍报修系统</h4>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">用户名</label>
                    <input type="text" id="username" class="form-control" placeholder="请输入用户名">
                </div>
                <div class="mb-3">
                    <label class="form-label">密码</label>
                    <input type="password" id="password" class="form-control" placeholder="请输入密码">
                </div>
                <button class="btn btn-primary w-100" onclick="login()">登录</button>
                <div class="text-center mt-3">
                    还没有账号？ <span class="register-link text-primary" data-bs-toggle="modal" data-bs-target="#registerModal">立即注册</span>
                </div>
                <div id="msg" class="mt-3 text-danger text-center"></div>
            </div>
        </div>
    </div>

    <!-- 注册 Modal -->
    <div class="modal fade" id="registerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">用户注册</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" id="regUsername" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密码</label>
                        <input type="password" id="regPassword" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">角色</label>
                        <select id="regRole" class="form-select">
                            <option value="student">学生</option>
                            <option value="repairman">维修工</option>
                            <option value="admin">管理员</option>
                        </select>
                    </div>
                    <div id="regMsg" class="text-danger"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-success" onclick="register()">注册</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            const data = await res.json();
            if (data.access_token) {
                localStorage.setItem('token', data.access_token);
                localStorage.setItem('role', data.role);
                if (data.role === 'student') location.href = '/student.html';
                else if (data.role === 'repairman') location.href = '/repairman.html';
                else if (data.role === 'admin') location.href = '/admin.html';
                else location.href = '/';
            } else {
                document.getElementById('msg').innerText = data.error || '登录失败';
            }
        }

        async function register() {
            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;
            const role = document.getElementById('regRole').value;
            if (!username || !password) {
                document.getElementById('regMsg').innerText = '用户名和密码不能为空';
                return;
            }
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password, role})
            });
            const data = await res.json();
            if (res.ok) {
                alert('注册成功！请登录');
                document.getElementById('registerModal').querySelector('.btn-close').click();
                document.getElementById('regUsername').value = '';
                document.getElementById('regPassword').value = '';
                document.getElementById('regMsg').innerText = '';
            } else {
                document.getElementById('regMsg').innerText = data.error || '注册失败';
            }
        }
    </script>
</body>
</html>
