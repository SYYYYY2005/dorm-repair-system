<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>宿舍报修系统 · 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景装饰圆点 */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            top: -100px;
            left: -100px;
            z-index: 0;
        }
        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
            bottom: -150px;
            right: -150px;
            z-index: 0;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(2px);
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            overflow: hidden;
            width: 100%;
            max-width: 450px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            z-index: 1;
        }

        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 55px -12px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            background: linear-gradient(135deg, #2c3e66 0%, #1e2a4a 100%);
            color: white;
            text-align: center;
            padding: 2rem 1.5rem;
            border: none;
        }

        .card-header h3 {
            font-weight: 700;
            letter-spacing: -0.5px;
            margin: 0;
            font-size: 1.8rem;
        }

        .card-header p {
            font-size: 0.9rem;
            opacity: 0.85;
            margin-top: 0.5rem;
        }

        .card-body {
            padding: 2rem 1.8rem;
        }

        .input-group {
            margin-bottom: 1.2rem;
        }

        .input-group-text {
            background: #f8f9fc;
            border-right: none;
            border-radius: 1rem 0 0 1rem;
            color: #6c757d;
        }

        .form-control {
            border-left: none;
            border-radius: 0 1rem 1rem 0;
            padding: 0.7rem 1rem;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }

        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 2rem;
            padding: 0.75rem;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            color: white;
            width: 100%;
            margin-top: 0.5rem;
        }

        .btn-login:hover {
            transform: scale(0.98);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            background: linear-gradient(135deg, #5a67d8 0%, #6b46a0 100%);
        }

        .register-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }

        .register-link span {
            color: #667eea;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .register-link span:hover {
            text-decoration: underline;
            color: #5a67d8;
        }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1100;
        }

        /* 注册模态框优化 */
        .modal-content {
            border-radius: 1.5rem;
            overflow: hidden;
        }

        .modal-header {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border: none;
        }

        .modal-footer .btn {
            border-radius: 2rem;
        }
    </style>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>

<div class="login-card">
    <div class="card-header">
        <h3><i class="fas fa-tools me-2"></i>宿舍报修系统</h3>
        <p>一站式宿舍维修服务</p>
    </div>
    <div class="card-body">
        <div class="input-group">
            <span class="input-group-text"><i class="fas fa-user"></i></span>
            <input type="text" id="username" class="form-control" placeholder="用户名" autocomplete="off">
        </div>
        <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input type="password" id="password" class="form-control" placeholder="密码" autocomplete="off">
            <span class="input-group-text" style="cursor:pointer;" onclick="togglePassword()"><i class="far fa-eye" id="toggleIcon"></i></span>
        </div>
        <button class="btn btn-login" onclick="login()"><i class="fas fa-sign-in-alt me-2"></i>登录</button>
        <div class="register-link">
            还没有账号？ <span data-bs-toggle="modal" data-bs-target="#registerModal">立即注册</span>
        </div>
    </div>
</div>

<!-- 注册模态框（美化版） -->
<div class="modal fade" id="registerModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-user-plus me-2"></i>用户注册</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">用户名</label>
                    <input type="text" id="regUsername" class="form-control" placeholder="请输入用户名">
                </div>
                <div class="mb-3">
                    <label class="form-label">密码</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="至少6位">
                </div>
                <div class="mb-3">
                    <label class="form-label">角色</label>
                    <select id="regRole" class="form-select">
                        <option value="student">学生</option>
                        <option value="repairman">维修工</option>
                        <option value="admin">管理员</option>
                    </select>
                </div>
                <div id="regMsg" class="text-danger small mt-2"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-success" onclick="register()">注册</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function showToast(message, type='success') {
        const container = document.getElementById('toastContainer');
        const toastHtml = `<div class="toast align-items-center text-white bg-${type} border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body">${message}</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>`;
        container.insertAdjacentHTML('beforeend', toastHtml);
        const toastEl = container.lastElementChild;
        const bsToast = new bootstrap.Toast(toastEl, { autohide: true, delay: 2000 });
        bsToast.show();
        toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
    }

    function togglePassword() {
        const pwd = document.getElementById('password');
        const icon = document.getElementById('toggleIcon');
        if (pwd.type === 'password') {
            pwd.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            pwd.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    async function login() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        if (!username || !password) {
            showToast('请输入用户名和密码', 'danger');
            return;
        }
        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.access_token) {
                localStorage.setItem('token', data.access_token);
                localStorage.setItem('role', data.role);
                showToast('登录成功', 'success');
                setTimeout(() => {
                    if (data.role === 'student') location.href = '/student.html';
                    else if (data.role === 'repairman') location.href = '/repairman.html';
                    else if (data.role === 'admin') location.href = '/admin.html';
                    else location.href = '/';
                }, 800);
            } else {
                showToast(data.error || '登录失败', 'danger');
            }
        } catch (err) {
            showToast('网络错误', 'danger');
        }
    }

    async function register() {
        const username = document.getElementById('regUsername').value.trim();
        const password = document.getElementById('regPassword').value;
        const role = document.getElementById('regRole').value;
        if (!username || !password) {
            document.getElementById('regMsg').innerText = '用户名和密码不能为空';
            return;
        }
        if (password.length < 6) {
            document.getElementById('regMsg').innerText = '密码至少6位';
            return;
        }
        try {
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, role })
            });
            const data = await res.json();
            if (res.ok) {
                showToast('注册成功，请登录', 'success');
                const modal = bootstrap.Modal.getInstance(document.getElementById('registerModal'));
                modal.hide();
                document.getElementById('regUsername').value = '';
                document.getElementById('regPassword').value = '';
                document.getElementById('regMsg').innerText = '';
            } else {
                document.getElementById('regMsg').innerText = data.error || '注册失败';
            }
        } catch (err) {
            document.getElementById('regMsg').innerText = '网络错误';
        }
    }
</script>
</body>
</html>
